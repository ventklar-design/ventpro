<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VentPro Elite - Klar Hallströms Edition</title>
    <style>
        :root { --accent: #fbc531; --bg: #0d0d0d; --card: #181818; --input: #252525; --success: #2ecc71; --danger: #e74c3c; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: var(--card); padding: 20px; border-radius: 16px; width: 100%; max-width: 480px; border: 1px solid #333; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .display-area { background: #000; border-radius: 12px; min-height: 130px; margin-bottom: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 2px solid #444; text-align: center; padding: 10px; }
        .res-label { font-size: 0.65rem; color: var(--accent); letter-spacing: 1px; font-weight: bold; text-transform: uppercase; }
        .res-main { font-size: 3.2rem; font-weight: 900; margin: 5px 0; color: #fff; }
        .res-sub { font-size: 0.8rem; color: #666; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .field { display: flex; flex-direction: column; }
        label { font-size: 0.6rem; color: #888; text-transform: uppercase; margin-bottom: 4px; font-weight: bold; }
        input, select { padding: 14px; border-radius: 8px; border: 1px solid #333; background: var(--input); color: #fff; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--accent); }
        .footer-tag { margin-top: 15px; font-size: 0.6rem; color: #444; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="card">
    <div class="display-area" id="displayBox">
        <div class="res-label">Kapmått mellan sickar (L)</div>
        <div class="res-main" id="valL">0 mm</div>
        <div class="res-sub" id="valCC">C-C: 0 mm</div>
    </div>

    <div class="grid">
        <div class="field"><label>Dimension</label>
            <select id="d" onchange="calc()">
                <option value="100">Ø100</option>
                <option value="125">Ø125</option>
                <option value="160" selected>Ø160</option>
                <option value="200">Ø200</option>
                <option value="250">Ø250</option>
                <option value="315">Ø315</option>
                <option value="400">Ø400</option>
                <option value="500">Ø500</option>
                <option value="630">Ø630</option>
            </select>
        </div>
        <div class="field"><label>Justera (+/-)</label><input type="number" id="adj" value="0" oninput="calc()"></div>
        
        <div class="field"><label>Vinkel 1</label>
            <select id="v1" onchange="calc()">
                <option value="90">90°</option>
                <option value="60">60°</option>
                <option value="45" selected>45°</option>
                <option value="30">30°</option>
                <option value="15">15°</option>
            </select>
        </div>
        <div class="field"><label>Typ 1</label>
            <select id="t1" onchange="calc()">
                <option value="BS">Normal (BS/HV)</option>
                <option value="BK">Kort (HIBK)</option>
            </select>
        </div>

        <div class="field"><label>Vinkel 2</label>
            <select id="v2" onchange="calc()">
                <option value="90">90°</option>
                <option value="60">60°</option>
                <option value="45" selected>45°</option>
                <option value="30">30°</option>
                <option value="15">15°</option>
            </select>
        </div>
        <div class="field"><label>Typ 2</label>
            <select id="t2" onchange="calc()">
                <option value="BS">Normal (BS/HV)</option>
                <option value="BK">Kort (HIBK)</option>
            </select>
        </div>

        <div class="field"><label>S-mått (Sido)</label><input type="number" id="s" placeholder="mm" oninput="calc()"></div>
        <div class="field"><label>H-mått (Höjd)</label><input type="number" id="h" placeholder="mm" oninput="calc()"></div>
    </div>
    <div style="text-align:center" class="footer-tag">Klar Verified | Hallströms Data</div>
</div>

<script>
    // VERIFIERAD DATA FRÅN HALLSTRÖMS PRODUKTBLAD
    const hallstromData = {
        BK: { // Kortböj HIBK (Bild 1)
            100: {90:60, r:60}, 125: {90:73, r:73}, 160: {90:95, r:95}, 200: {90:112, r:120},
            250: {90:160, r:150}, 315: {90:195, r:190}, 400: {90:240, r:240}, 500: {90:314, r:300}, 630: {90:385, r:378}
        },
        BS: { // Normalböj HV (Bild 2-7)
            100: {90:100, 60:58, 45:41, 30:27, 15:13},
            125: {90:125, 60:72, 45:52, 30:33, 15:16},
            160: {90:160, 60:92, 45:66, 30:43, 15:21},
            200: {90:200, 60:115, 45:83, 30:54, 15:26},
            250: {90:250, 60:144, 45:104, 30:67, 15:33},
            315: {90:315, 60:182, 45:130, 30:84, 15:41},
            400: {90:400, 60:231, 45:166, 30:107, 15:53},
            500: {90:500, 60:289, 45:207, 30:134, 15:66},
            630: {90:630, 60:364, 45:261, 30:169, 15:83}
        }
    };

    function getBuildMeasure(v, type, d) {
        v = parseInt(v);
        const dData = hallstromData[type][d];
        if (type === 'BS' && dData[v]) return dData[v];
        if (type === 'BK') {
            if (v === 90) return dData.90;
            return Math.round(dData.r * Math.tan((v / 2) * (Math.PI / 180)));
        }
        return Math.round(d * Math.tan((v / 2) * (Math.PI / 180)));
    }

    function calc() {
        const d = document.getElementById('d').value;
        const v1 = document.getElementById('v1').value;
        const v2 = document.getElementById('v2').value;
        const s = parseFloat(document.getElementById('s').value) || 0;
        const h = parseFloat(document.getElementById('h').value) || 0;
        const adj = parseFloat(document.getElementById('adj').value) || 0;

        if (s === 0 && h === 0) {
            document.getElementById('valL').innerText = "0 mm";
            document.getElementById('valCC').innerText = "C-C: 0 mm";
            return;
        }

        const a1 = getBuildMeasure(v1, document.getElementById('t1').value, d);
        const a2 = getBuildMeasure(v2, document.getElementById('t2').value, d);

        const offset = Math.sqrt(s*s + h*h);
        const avgV = (parseInt(v1) + parseInt(v2)) / 2;
        const cc = offset / Math.sin(avgV * (Math.PI/180));
        const l = Math.round(cc - (a1 + a2) + adj);

        document.getElementById('valL').innerText = (l > 0 ? l : 0) + " mm";
        document.getElementById('valCC').innerText = "C-C: " + Math.round(cc) + " mm";
        document.getElementById('displayBox').style.borderColor = l < 0 ? "var(--danger)" : "#444";
    }
</script>
</body>
</html>
