<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VentPro Elite v4.2 - Klar Master Final</title>
    <style>
        :root { 
            --accent: #fbc531; --bg: #0d0d0d; --card: #181818; --input: #252525; 
            --success: #2ecc71; --danger: #e74c3c;
            --btn-bend: #ff9f43; --btn-pipe: #54a0ff; --btn-part: #5f27cd; --btn-other: #48dbfb;
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; touch-action: manipulation; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: var(--card); padding: 20px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); border: 1px solid #333; margin-bottom: 20px; }
        .display-area { background: #000; border-radius: 12px; min-height: 140px; margin-bottom: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 2px solid #444; background-image: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); padding: 10px; text-align: center; transition: border-color 0.3s; }
        .res-label { font-size: 0.6rem; color: var(--accent); letter-spacing: 1.5px; font-weight: bold; text-transform: uppercase; }
        .res-main { font-size: 2.8rem; font-weight: 900; color: #fff; line-height: 1; margin: 5px 0; }
        .res-extra { font-size: 0.8rem; color: #888; }
        .tab-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab-btn { flex: 1; padding: 10px; border: 1px solid #333; border-radius: 8px; background: transparent; color: #555; font-weight: 800; text-transform: uppercase; font-size: 0.65rem; cursor: pointer; }
        .tab-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(251, 197, 49, 0.1); }
        .tab-btn.brand-active { border-color: var(--success); color: var(--success); background: rgba(46, 204, 113, 0.1); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; position: relative; }
        label { font-size: 0.6rem; color: #888; text-transform: uppercase; font-weight: 800; margin-bottom: 4px; }
        input, select { padding: 14px; border-radius: 8px; border: 1px solid #333; background: var(--input); color: #fff; font-size: 1rem; width: 100%; outline: none; }
        .swap-btn { position: absolute; right: 45%; bottom: 15px; background: #333; border: 1px solid #444; color: var(--accent); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; font-weight: bold; }
        .calc-wrapper { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #333; }
        .calc-screen { background: #000; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
        #calcDisplay { font-family: monospace; font-size: 1.2rem; color: var(--accent); }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .c-btn { padding: 12px; border-radius: 6px; border: none; background: #333; color: #fff; font-weight: bold; cursor: pointer; }
        .c-btn.op { background: #444; color: var(--accent); }
        .c-btn.eq { background: var(--accent); color: #000; grid-column: span 2; }
        .use-btn { background: var(--success); color: #fff; padding: 5px 8px; border-radius: 4px; font-size: 0.6rem; margin-left: 4px; cursor: pointer; border: none; font-weight: bold; }
        .order-section { width: 100%; max-width: 480px; background: #121212; border-radius: 16px; border: 1px solid #222; padding: 15px; margin-bottom: 20px; }
        .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .plus-btn { border: none; color: #fff; padding: 10px 2px; border-radius: 6px; font-size: 0.55rem; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-b { background: var(--btn-bend); } .btn-r { background: var(--btn-pipe); } .btn-p { background: var(--btn-part); } .btn-o { background: var(--btn-other); }
        .list-container { background: #000; border-radius: 10px; border: 1px solid #222; padding: 5px; min-height: 40px; margin-top: 15px; }
        .list-item { display: flex; align-items: center; padding: 8px; border-bottom: 1px solid #222; font-size: 0.8rem; }
        .qty { background: var(--accent); color: #000; font-weight: bold; padding: 3px 8px; border-radius: 4px; margin-right: 10px; }
        .del-btn { color: var(--danger); background: none; border: none; font-size: 1.2rem; margin-left: auto; cursor: pointer; }
        .calc-btn-main { width: 100%; padding: 18px; border: none; border-radius: 10px; background: var(--success); color: #fff; font-weight: 900; text-transform: uppercase; margin-top: 10px; cursor: pointer; }
        .clear-log-btn { background: none; border: none; color: var(--danger); font-size: 0.6rem; font-weight: 800; text-transform: uppercase; cursor: pointer; padding: 10px; width: 100%; text-align: right; opacity: 0.7; }
    </style>
</head>
<body onload="loadData()">

<div class="card">
    <div class="tab-row">
        <button id="brandL" class="tab-btn brand-active" onclick="setBrand('lindab')">LINDAB</button>
        <button id="brandH" class="tab-btn" onclick="setBrand('hallstrom')">HALLSTRÖM</button>
    </div>

    <div class="display-area" id="mainDisplay">
        <div class="res-label">Kapmått L (Mellan sickar)</div>
        <div class="res-main" id="valL">0 mm</div>
        <div id="infoBox" class="res-extra">Välj mått ovan</div>
    </div>

    <div class="tab-row">
        <button id="tr" class="tab-btn active" onclick="setMode('rund')">RUND (Ø)</button>
        <button id="tk" class="tab-btn" onclick="setMode('rekt')">REKT (r)</button>
    </div>

    <div class="grid">
        <div id="d-box"><label>Dimension</label>
            <select id="d" onchange="calc()">
                <option value="100">Ø100</option><option value="125">Ø125</option><option value="160" selected>Ø160</option>
                <option value="200">Ø200</option><option value="250">Ø250</option><option value="315">Ø315</option>
                <option value="400">Ø400</option><option value="500">Ø500</option><option value="630">Ø630</option>
                <option value="800">Ø800</option><option value="1000">Ø1000</option><option value="1250">Ø1250</option>
            </select>
        </div>
        <div id="u-box" style="display:none;"><label>Bredd (U)</label><input type="number" id="u" placeholder="mm" oninput="ar();calc()"></div>
        <div id="r-box" style="display:none;"><label>Radie (r)</label><input type="number" id="r" placeholder="mm" oninput="calc()"></div>
        <div><label>Justera (+/-)</label><input type="number" id="adj" value="0" oninput="calc()"></div>

        <div><label>Vinkel 1</label>
            <select id="v1" onchange="updateTypeVisibility();calc()">
                <option value="90">90°</option><option value="60">60°</option><option value="45" selected>45°</option><option value="30">30°</option><option value="15">15°</option>
            </select>
        </div>
        <div id="t1-container"><label id="lblT1">Typ 1 (BU/BKFU)</label>
            <select id="t1" onchange="calc()">
                <option value="normal">Normal</option><option value="kort">Kort</option>
            </select>
        </div>

        <div><label>Vinkel 2</label>
            <select id="v2" onchange="updateTypeVisibility();calc()">
                <option value="90">90°</option><option value="60">60°</option><option value="45" selected>45°</option><option value="30">30°</option><option value="15">15°</option>
            </select>
        </div>
        <div id="t2-container"><label id="lblT2">Typ 2 (BU/BKFU)</label>
            <select id="t2" onchange="calc()">
                <option value="normal">Normal</option><option value="kort">Kort</option>
            </select>
        </div>

        <div><label>Sido (S)</label><input type="number" id="s" placeholder="mm" oninput="calc()"></div>
        <div class="swap-btn" onclick="swapSH()">⇄</div>
        <div><label>Höjd (H)</label><input type="number" id="h" placeholder="mm" oninput="calc()"></div>
    </div>

    <div class="calc-wrapper">
        <div class="calc-screen"><div id="calcDisplay">0</div><div><button class="use-btn" onclick="useCalc('s')">S</button><button class="use-btn" onclick="useCalc('h')">H</button></div></div>
        <div class="calc-grid">
            <button class="c-btn" onclick="cInp('7')">7</button><button class="c-btn" onclick="cInp('8')">8</button><button class="c-btn" onclick="cInp('9')">9</button><button class="c-btn op" onclick="cInp('/')">/</button>
            <button class="c-btn" onclick="cInp('4')">4</button><button class="c-btn" onclick="cInp('5')">5</button><button class="c-btn" onclick="cInp('6')">6</button><button class="c-btn op" onclick="cInp('*')">*</button>
            <button class="c-btn" onclick="cInp('1')">1</button><button class="c-btn" onclick="cInp('2')">2</button><button class="c-btn" onclick="cInp('3')">3</button><button class="c-btn op" onclick="cInp('-')">-</button>
            <button class="c-btn" onclick="cInp('0')">0</button><button class="c-btn op" onclick="cInp('.')">.</button><button class="c-btn op" onclick="cInp('+')">+</button><button class="c-btn op" onclick="cInp('C')" style="color:var(--danger)">C</button>
            <button class="c-btn eq" onclick="cEval()">=</button>
        </div>
    </div>
    <button class="calc-btn-main" onclick="log()">Spara Beräkning</button>
</div>

<div class="order-section">
    <div class="res-label" style="text-align: center; margin-bottom: 10px;">Beställningslista</div>
    <input type="text" id="tag" placeholder="Märkning..." style="width:100%; padding:12px; margin-bottom:12px; background:var(--input); border:1px solid #444; color:#fff; border-radius:8px;">
    <div class="quick-grid">
        <button class="plus-btn btn-b" onclick="add('90° Böj')">90° B</button><button class="plus-btn btn-b" onclick="add('45° Böj')">45° B</button><button class="plus-btn btn-b" onclick="add('30° Böj')">30° B</button><button class="plus-btn btn-b" onclick="add('15° Böj')">15° B</button>
        <button class="plus-btn btn-r" onclick="add('Rör 3m')">Rör 3m</button><button class="plus-btn btn-r" onclick="add('T-Rör')">T-Rör</button><button class="plus-btn btn-r" onclick="add('M8 Gängstång')">M8 Gäng</button><button class="plus-btn btn-r" onclick="add('M10 Gängstång')">M10 Gäng</button>
        <button class="plus-btn btn-p" onclick="add('Muff')">Muff</button><button class="plus-btn btn-p" onclick="add('Nippel')">Nippel</button><button class="plus-btn btn-p" onclick="add('Skjutmuff')">Skjutmuff</button><button class="plus-btn btn-p" onclick="add('Dim-förs.')">Dim-förs.</button>
        <button class="plus-btn btn-o" onclick="add('Iris')">Iris</button><button class="plus-btn btn-o" onclick="add('Gavel')">Gavel</button><button class="plus-btn btn-o" onclick="add('Inlopp')">Inlopp</button><button class="plus-btn btn-o" onclick="add('Skruv')">Skruv</button>
    </div>
    <div id="orderList" class="list-container"></div>
    <button class="calc-btn-main" style="background:#222; color:var(--accent); border:1px solid var(--accent); margin-top:15px;" onclick="copy()">Kopiera SMS</button>
</div>

<div style="width:100%; max-width:480px;">
    <button class="clear-log-btn" onclick="clearLogs()">× Rensa historik</button>
    <div id="logList" class="list-container" style="margin-top:0; margin-bottom:40px;"></div>
</div>

<script>
    let mode = 'rund', brand = 'lindab', orders = {}, logs = [], cExpr = '';
    const db = {
        lindab: { 
            normal: { 100:{90:100,60:58,45:41,30:27,15:13}, 125:{90:125,60:72,45:52,30:33,15:17}, 160:{90:160,60:92,45:66,30:43,15:21}, 200:{90:200,60:115,45:83,30:54,15:27}, 250:{90:242,60:144,45:104,30:67,15:33}, 315:{90:315,60:182,45:130,30:84,15:42}, 400:{90:400,60:231,45:166,30:107,15:53}, 500:{90:500,60:289,45:207,30:134,15:66}, 630:{90:630,60:364,45:261,30:169,15:83} },
            kort: { 100:{90:62}, 125:{90:79}, 160:{90:94}, 200:{90:158}, 250:{90:180}, 315:{90:220}, 400:{90:255}, 500:{90:315}, 630:{90:397} }
        },
        hallstrom: { 
            normal: { 100:{90:100,60:58,45:41,30:27,15:13}, 125:{90:125,60:72,45:52,30:33,15:16}, 160:{90:160,60:92,45:66,30:43,15:21}, 200:{90:200,60:115,45:83,30:54,15:26}, 250:{90:250,60:144,45:104,30:67,15:33}, 315:{90:315,60:182,45:130,30:84,15:41}, 400:{90:400,60:231,45:166,30:107,15:53}, 500:{90:500,60:289,45:207,30:134,15:66}, 630:{90:630,60:364,45:261,30:169,15:83} },
            kort: { 100:{90:60}, 125:{90:73}, 160:{90:95}, 200:{90:112}, 250:{90:160}, 315:{90:195}, 400:{90:240}, 500:{90:314}, 630:{90:385} }
        }
    };

    function cInp(v) { if(v==='C'){cExpr='';} else {cExpr+=v;} document.getElementById('calcDisplay').innerText = cExpr || '0'; }
    function cEval() { try { cExpr = eval(cExpr).toString(); document.getElementById('calcDisplay').innerText = cExpr; } catch { cExpr = 'Fel'; document.getElementById('calcDisplay').innerText = cExpr; cExpr = ''; } }
    function useCalc(field) { const val = parseFloat(cExpr); if(!isNaN(val)) { document.getElementById(field).value = val; calc(); cExpr = ''; document.getElementById('calcDisplay').innerText = '0'; } }
    function swapSH() { const s = document.getElementById('s').value, h = document.getElementById('h').value; document.getElementById('s').value = h; document.getElementById('h').value = s; calc(); }
    function updateTypeVisibility() {
        const v1 = document.getElementById('v1').value, v2 = document.getElementById('v2').value;
        const t1c = document.getElementById('t1-container'), t2c = document.getElementById('t2-container');
        if(mode === 'rund') {
            if(v1 !== "90") document.getElementById('t1').value = "normal";
            if(v2 !== "90") document.getElementById('t2').value = "normal";
            t1c.style.opacity = v1 === "90" ? "1" : "0.3";
            t2c.style.opacity = v2 === "90" ? "1" : "0.3";
        } else { t1c.style.opacity = "0.3"; t2c.style.opacity = "0.3"; }
    }

    function setBrand(b) { 
        brand = b; document.getElementById('brandL').classList.toggle('brand-active', b === 'lindab'); 
        document.getElementById('brandH').classList.toggle('brand-active', b === 'hallstrom'); 
        const suffix = b==='lindab'?' (BU/BKFU)':' (BS/BK)';
        document.getElementById('lblT1').innerText = 'Typ 1' + suffix;
        document.getElementById('lblT2').innerText = 'Typ 2' + suffix;
        calc(); 
    }

    function setMode(t) { 
        mode = t; document.getElementById('d-box').style.display = t==='rund'?'block':'none';
        document.getElementById('u-box').style.display = t==='rekt'?'block':'none'; 
        document.getElementById('r-box').style.display = t==='rekt'?'block':'none';
        document.getElementById('tr').classList.toggle('active', t==='rund'); 
        document.getElementById('tk').classList.toggle('active', t==='rekt'); 
        updateTypeVisibility(); calc(); 
    }

    function ar() { const u = parseFloat(document.getElementById('u').value); if(u) document.getElementById('r').value = 100 + (u/2); }

    function getA(v, type, d) { 
        v = parseInt(v); 
        if(mode === 'rekt') {
            const radie = parseFloat(document.getElementById('r').value) || 125;
            let ben = brand === 'hallstrom' ? (v >= 60 ? 150 : 100) : 130;
            return Math.round(ben + (radie * Math.tan((v/2)*(Math.PI/180))));
        }
        return db[brand][type][d]?.[v] || Math.round(d * Math.tan((v/2)*(Math.PI/180))); 
    }

    function calc() { 
        const d = document.getElementById('d').value, v1 = document.getElementById('v1').value, v2 = document.getElementById('v2').value;
        const s = parseFloat(document.getElementById('s').value)||0, h = parseFloat(document.getElementById('h').value)||0;
        const a1 = getA(v1, document.getElementById('t1').value, d), a2 = getA(v2, document.getElementById('t2').value, d);
        const off = Math.sqrt(s*s + h*h), rad = ((parseInt(v1)+parseInt(v2))/2)*(Math.PI/180);
        const l = Math.max(0, Math.round((off/Math.sin(rad)) - (a1+a2) + (parseFloat(document.getElementById('adj').value)||0))); 
        const E = off > 0 ? Math.round((off / Math.tan(rad)) + a1 + a2) : 0;
        document.getElementById('valL').innerText = l + " mm"; 
        document.getElementById('infoBox').innerHTML = `E-mått: <b>${E} mm</b> | z: ${a1}+${a2}<br>${mode==='rekt'?'Rekt: '+brand.toUpperCase():'Rund: Ø'+d+' | '+brand.toUpperCase()}`;
    }

    function add(n) { let k = (mode==='rund'?'Ø'+document.getElementById('d').value:'Rekt')+' '+n; orders[k] = (orders[k]||0)+1; save(); }
    function log() { 
        const l = document.getElementById('valL').innerText, disp = document.getElementById('mainDisplay');
        if(l!=="0 mm") { 
            logs.unshift(`[${brand.toUpperCase()}] L:${l} (${mode==='rund'?'Ø'+document.getElementById('d').value:'Rekt'})`); 
            if(logs.length>10) logs.pop(); 
            disp.style.borderColor = "var(--success)"; setTimeout(() => disp.style.borderColor = "#444", 400); save(); 
        } 
    }
    function clearLogs() { if(confirm("Rensa historik?")) { logs = []; save(); } }
    function save() { localStorage.setItem('vent_master_v42', JSON.stringify({orders, logs, brand})); render(); }
    function loadData() { const s = JSON.parse(localStorage.getItem('vent_master_v42')||'{}'); orders = s.orders||{}; logs = s.logs||[]; if(s.brand) setBrand(s.brand); render(); calc(); }
    function render() { 
        const oList = document.getElementById('orderList'); oList.innerHTML = ''; 
        for (const [k, q] of Object.entries(orders)) oList.innerHTML += `<div class="list-item"><span class="qty">${q}</span><span style="flex:1">${k}</span><button class="del-btn" onclick="remove('${k}')">×</button></div>`;
        document.getElementById('logList').innerHTML = logs.map(x => `<div class="list-item"><span style="color:#888; font-size:0.7rem;">${x}</span></div>`).join(''); 
    }
    function remove(k) { delete orders[k]; save(); }
    function copy() { 
        let t = `BESTÄLLNING - ${brand.toUpperCase()}\n${document.getElementById('tag').value}\n\n`; 
        for (const [k, q] of Object.entries(orders)) t += `${q}st ${k}\n`; 
        navigator.clipboard.writeText(t).then(() => alert("Kopierat!"));
    }
</script>
</body>
</html>
