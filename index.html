<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VentPro Elite v4.0 - Klar Master BigDim</title>
    <style>
        :root { 
            --accent: #fbc531; --bg: #0d0d0d; --card: #181818; --input: #252525; 
            --success: #2ecc71; --danger: #e74c3c;
            --btn-bend: #ff9f43; --btn-pipe: #54a0ff; --btn-part: #5f27cd; --btn-other: #48dbfb;
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; touch-action: manipulation; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .card { background: var(--card); padding: 20px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); border: 1px solid #333; margin-bottom: 20px; }
        .display-area { background: #000; border-radius: 12px; min-height: 140px; margin-bottom: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 2px solid #444; background-image: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); padding: 10px; text-align: center; }
        .res-label { font-size: 0.65rem; color: var(--accent); letter-spacing: 1.5px; font-weight: bold; text-transform: uppercase; }
        .res-main { font-size: 3.2rem; font-weight: 900; color: #fff; line-height: 1; margin: 8px 0; }
        .res-extra { font-size: 0.85rem; color: #aaa; line-height: 1.5; }
        .tab-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab-btn { flex: 1; padding: 12px; border: 1px solid #333; border-radius: 8px; background: transparent; color: #666; font-weight: 800; text-transform: uppercase; font-size: 0.7rem; cursor: pointer; }
        .tab-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(251, 197, 49, 0.1); }
        .tab-btn.brand-active { border-color: var(--success); color: var(--success); background: rgba(46, 204, 113, 0.1); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; position: relative; }
        label { font-size: 0.6rem; color: #888; text-transform: uppercase; font-weight: 800; margin-bottom: 4px; display: block; }
        input, select { padding: 14px; border-radius: 8px; border: 1px solid #333; background: var(--input); color: #fff; font-size: 1rem; width: 100%; outline: none; }
        .calc-wrapper { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #333; }
        .calc-screen { background: #000; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
        #calcDisplay { font-family: monospace; font-size: 1.4rem; color: var(--accent); }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .c-btn { padding: 15px; border-radius: 8px; border: none; background: #333; color: #fff; font-weight: bold; cursor: pointer; }
        .c-btn.op { background: #444; color: var(--accent); }
        .c-btn.eq { background: var(--accent); color: #000; grid-column: span 2; }
        .use-btn { background: var(--success); color: #fff; padding: 6px 10px; border-radius: 4px; font-size: 0.7rem; border: none; font-weight: bold; }
        .order-section { width: 100%; max-width: 480px; background: #121212; border-radius: 16px; border: 1px solid #222; padding: 20px; margin-bottom: 20px; }
        .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .plus-btn { border: none; color: #fff; padding: 12px 2px; border-radius: 8px; font-size: 0.6rem; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-b { background: var(--btn-bend); } .btn-r { background: var(--btn-pipe); } .btn-p { background: var(--btn-part); } .btn-o { background: var(--btn-other); }
        .list-container { background: #000; border-radius: 10px; border: 1px solid #222; padding: 5px; min-height: 40px; margin-top: 15px; }
        .list-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #222; font-size: 0.9rem; }
        .qty { background: var(--accent); color: #000; font-weight: bold; padding: 4px 10px; border-radius: 6px; margin-right: 12px; }
        .calc-btn-main { width: 100%; padding: 18px; border: none; border-radius: 10px; background: var(--success); color: #fff; font-weight: 900; text-transform: uppercase; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body onload="loadData()">

<div class="card">
    <div class="tab-row">
        <button id="brandL" class="tab-btn brand-active" onclick="setBrand('lindab')">LINDAB (BU/BFU)</button>
        <button id="brandH" class="tab-btn" onclick="setBrand('hallstrom')">HALLSTRÖM (BS)</button>
    </div>

    <div class="display-area" id="mainDisplay">
        <div class="res-label">KAPMÅTT L (MELLAN MUFFAR)</div>
        <div class="res-main" id="valL">0 mm</div>
        <div id="infoBox" class="res-extra">E-mått (Bygglängd): 0 mm<br>Diagonal: 0mm | z: 0+0</div>
    </div>

    <div class="grid">
        <div id="d-box" style="grid-column: span 2;"><label>Dimension</label>
            <select id="d" onchange="calc()">
                <option value="100">Ø100</option><option value="125">Ø125</option><option value="160">Ø160</option>
                <option value="200" selected>Ø200</option><option value="250">Ø250</option><option value="315">Ø315</option>
                <option value="400">Ø400</option><option value="500">Ø500</option><option value="630">Ø630</option>
                <option value="800">Ø800</option><option value="1000">Ø1000</option><option value="1250">Ø1250</option>
            </select>
        </div>
        
        <div><label>Vinkel 1</label>
            <select id="v1" onchange="calc()">
                <option value="90">90°</option><option value="60">60°</option><option value="45" selected>45°</option><option value="30">30°</option><option value="15">15°</option>
            </select>
        </div>
        <div><label id="lblT1">Typ 1</label>
            <select id="t1" onchange="calc()">
                <option value="normal">Normal</option><option value="kort">Kort</option>
            </select>
        </div>
        <div><label>Sido (S) - CC</label><input type="number" id="s" placeholder="mm" oninput="calc()"></div>
        <div><label>Höjd (H) - CC</label><input type="number" id="h" placeholder="mm" oninput="calc()"></div>
        <div style="grid-column: span 2;"><label>Justera (+/- mm)</label><input type="number" id="adj" value="0" oninput="calc()"></div>
    </div>

    <div class="calc-wrapper">
        <div class="calc-screen"><div id="calcDisplay">0</div><div><button class="use-btn" onclick="useCalc('s')">S</button> <button class="use-btn" onclick="useCalc('h')">H</button></div></div>
        <div class="calc-grid">
            <button class="c-btn" onclick="cInp('7')">7</button><button class="c-btn" onclick="cInp('8')">8</button><button class="c-btn" onclick="cInp('9')">9</button><button class="c-btn op" onclick="cInp('/')">/</button>
            <button class="c-btn" onclick="cInp('4')">4</button><button class="c-btn" onclick="cInp('5')">5</button><button class="c-btn" onclick="cInp('6')">6</button><button class="c-btn op" onclick="cInp('*')">*</button>
            <button class="c-btn" onclick="cInp('1')">1</button><button class="c-btn" onclick="cInp('2')">2</button><button class="c-btn" onclick="cInp('3')">3</button><button class="c-btn op" onclick="cInp('-')">-</button>
            <button class="c-btn" onclick="cInp('0')">0</button><button class="c-btn op" onclick="cInp('.')">.</button><button class="c-btn op" onclick="cInp('+')">+</button><button class="c-btn op" onclick="cInp('C')">C</button>
            <button class="c-btn eq" onclick="cEval()">=</button>
        </div>
    </div>
</div>

<div class="order-section">
    <div class="quick-grid">
        <button class="plus-btn btn-b" onclick="add('90° Böj')">90° B</button><button class="plus-btn btn-b" onclick="add('45° Böj')">45° B</button>
        <button class="plus-btn btn-r" onclick="add('Rör 3m')">Rör 3m</button><button class="plus-btn btn-p" onclick="add('Muff')">Muff</button>
        <button class="plus-btn btn-p" onclick="add('Nippel')">Nippel</button><button class="plus-btn btn-o" onclick="add('Iris')">Iris</button>
        <button class="plus-btn btn-o" onclick="add('Skruv')">Skruv</button><button class="plus-btn btn-o" onclick="add('M8 Gäng')">M8</button>
    </div>
    <div id="orderList" class="list-container"></div>
    <button class="calc-btn-main" style="background:#222; color:var(--accent); border:1px solid var(--accent);" onclick="copy()">Kopiera SMS</button>
</div>

<script>
    let brand = 'lindab', orders = {}, cExpr = '';
    const db = {
        lindab: { 
            normal: { 100:{90:100,60:58,45:41,30:27,15:13}, 125:{90:125,60:72,45:52,30:33,15:17}, 160:{90:160,60:92,45:66,30:43,15:21}, 200:{90:200,60:115,45:83,30:54,15:27}, 250:{90:242,60:144,45:104,30:67,15:33}, 315:{90:315,60:182,45:130,30:84,15:42}, 400:{90:400,60:231,45:166,30:107,15:53}, 500:{90:500,60:289,45:207,30:134,15:66}, 630:{90:630,60:364,45:261,30:169,15:83} },
            kort: { 100:{90:62}, 125:{90:79}, 160:{90:94}, 200:{90:158}, 250:{90:180}, 315:{90:220} }
        },
        hallstrom: { 
            normal: { 100:{90:100,60:58,45:41,30:27,15:13}, 125:{90:125,60:72,45:52,30:33,15:16}, 160:{90:160,60:92,45:66,30:43,15:21}, 200:{90:200,60:115,45:83,30:54,15:26}, 250:{90:250,60:144,45:104,30:67,15:33}, 315:{90:315,60:182,45:130,30:84,15:41} },
            kort: { 100:{90:60}, 125:{90:73}, 160:{90:95}, 200:{90:112}, 250:{90:160}, 315:{90:195} }
        }
    };

    function cInp(v) { if(v==='C'){cExpr='';} else {cExpr+=v;} document.getElementById('calcDisplay').innerText = cExpr || '0'; }
    function cEval() { try { cExpr = eval(cExpr).toString(); document.getElementById('calcDisplay').innerText = cExpr; } catch { cExpr = '0'; } }
    function useCalc(field) { const val = parseFloat(cExpr); if(!isNaN(val)) { document.getElementById(field).value = Math.round(val); calc(); cExpr = ''; document.getElementById('calcDisplay').innerText='0'; } }
    function setBrand(b) { brand = b; document.getElementById('brandL').className = b==='lindab'?'tab-btn brand-active':'tab-btn'; document.getElementById('brandH').className = b==='hallstrom'?'tab-btn brand-active':'tab-btn'; calc(); }

    function getZ(v, type, d) { 
        v = parseInt(v); d = parseInt(d);
        // Om dimensionen finns i tabellen, använd den
        if(db[brand][type][d] && db[brand][type][d][v]) return db[brand][type][d][v];
        // Annars kör matematisk standard r=d (vilket gäller för 800+)
        return Math.round(d * Math.tan((v/2)*(Math.PI/180))); 
    }

    function calc() { 
        const d = document.getElementById('d').value, v1 = parseInt(document.getElementById('v1').value);
        const s = parseFloat(document.getElementById('s').value)||0, h = parseFloat(document.getElementById('h').value)||0, adj = parseFloat(document.getElementById('adj').value)||0;
        const z1 = getZ(v1, document.getElementById('t1').value, d);
        const totalOffset = Math.sqrt(s*s + h*h);
        const vRad = v1 * (Math.PI/180);
        
        const diagonal = totalOffset > 0 ? (totalOffset / Math.sin(vRad)) : 0;
        const resultL = diagonal > 0 ? Math.round(diagonal - (z1 * 2) + adj) : 0;
        const E = totalOffset > 0 ? Math.round((totalOffset / Math.tan(vRad)) + z1 * 2) : 0;

        document.getElementById('valL').innerText = (resultL > 0 ? resultL : 0) + " mm";
        document.getElementById('infoBox').innerHTML = `E-mått (Bygglängd): <b>${E} mm</b><br>Diagonal: ${Math.round(diagonal)}mm | z: ${z1}+${z1}`;
    }

    function add(n) { let k = 'Ø'+document.getElementById('d').value+' '+n; orders[k] = (orders[k]||0)+1; save(); }
    function save() { localStorage.setItem('vent_v40_master', JSON.stringify({orders, brand})); render(); }
    function loadData() { const s = JSON.parse(localStorage.getItem('vent_v40_master')||'{}'); orders = s.orders||{}; if(s.brand) setBrand(s.brand); render(); calc(); }
    function render() {
        const oList = document.getElementById('orderList'); oList.innerHTML = '';
        for (const [k, q] of Object.entries(orders)) oList.innerHTML += `<div class="list-item"><span class="qty">${q}</span><span style="flex:1">${k}</span><button style="background:none; border:none; color:red; font-weight:bold; font-size:1.2rem;" onclick="remove('${k}')">×</button></div>`;
    }
    function remove(k) { delete orders[k]; save(); }
    function copy() { 
        let t = `BESTÄLLNING - ${brand.toUpperCase()}\n\n`;
        for (const [k, q] of Object.entries(orders)) t += `${q}st ${k}\n`;
        navigator.clipboard.writeText(t).then(() => alert("Kopierat!"));
    }
</script>
</body>
</html>
